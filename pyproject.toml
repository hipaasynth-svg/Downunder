[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "downunder"
version = "0.1.0"
description = "NOOA agent that gets customers into Down Under and drives DrinkMinot loyalty"
readme = "README.md"
# nooa (the agent runtime) requires Python >=3.12,<3.14.
requires-python = ">=3.12,<3.14"
dependencies = [
    # https://github.com/NVIDIA-NeMo/labs-OO-Agents
    "nooa>=0.0.8,<0.1",
    "pydantic>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.setuptools]
packages = ["agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
